# Runs the chapter checkers and the Python labs on every push and pull request.
#
# They exist because this course has been wrong in ways that still ran: a demo
# whose "try this" step named a state it could not reach, an axis label 39px off
# the canvas, a sentence spliced into itself. None of that throws an error, so
# nothing but a check catches it.
name: checks

# push is limited to main because a pull_request event already covers every
# branch that has a PR open; listening to both ran the whole suite twice per push
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # no lockfile cache: the only dependency is playwright-core, and the
      # headless checks below do not launch a browser
      - run: npm install --no-audit --no-fund
      # smoke: the chapter contract (interactives, intro length, paragraph length)
      # paint: what every canvas actually draws, in a fake DOM
      # prose-check: the wreckage an edit leaves behind
      # content-inventory --check: quiz structure and control references
      - run: npm test

  # The Python labs, each run in its quick mode from an empty directory. A
  # separate job because it needs Python and PyTorch and nothing from node,
  # and so that a broken lab and a broken chapter show up as two red marks.
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      # the CPU-only wheel: about 200 MB, where the default Linux wheel pulls
      # in gigabytes of CUDA libraries that a runner without a GPU cannot use
      - run: pip install numpy
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: bash scripts/labs-check.sh
